<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ndBrain.exe // Booting...</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); color: var(--muted); }
        .spinner {
            width: 40px; height: 40px; border: 2px solid transparent; border-top-color: var(--accent);
            border-right-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="fade-in">

    <div class="spinner"></div>
    <div id="boot-text">[ ESTABLISHING CONNECTION... ]</div>

    <script>
        const bootText = document.getElementById('boot-text');
        
        // Update text sequence to fake a connection
        setTimeout(() => bootText.innerText = "[ DECRYPTING PAYLOAD... ]", 800);
        setTimeout(() => bootText.innerText = "[ SYNCING NODES... ]", 1600);
        
        // Redirect to the actual Vault page
        setTimeout(() => {
            window.location.href = 'vault.html';
        }, 2400);
    </script>
</body>
</html>
